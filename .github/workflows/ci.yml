name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  TEST_DATABASE_URL: postgres://task:task@127.0.0.1:5433/task_management_test

jobs:
  # ------------------------------------------------------------
  # 1. Lint and Typecheck
  # ------------------------------------------------------------
  lint-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

  # ------------------------------------------------------------
  # 2. API Tests
  # ------------------------------------------------------------
  api-tests:
    name: API Test Suite
    runs-on: ubuntu-latest
    needs: lint-typecheck
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: task
          POSTGRES_PASSWORD: task
          POSTGRES_DB: task_management_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U task -d task_management_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run API test suite
        run: npm run test

      - name: Run API test coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: coverage/
          retention-days: 30

  # ------------------------------------------------------------
  # 3. Dashboard Tests
  # ------------------------------------------------------------
  dashboard-tests:
    name: Dashboard Test Suite
    runs-on: ubuntu-latest
    needs: lint-typecheck
    defaults:
      run:
        working-directory: ./dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci

      - name: Run dashboard test suite
        run: npm run test

      - name: Run dashboard test coverage
        run: npm run test:dashboard:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-coverage
          path: dashboard/coverage/
          retention-days: 30

  # ------------------------------------------------------------
  # 4. Build Verification
  # ------------------------------------------------------------
  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [api-tests, dashboard-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: ./dashboard

      - name: Build API
        run: npm run build

      - name: Build Dashboard
        run: npm run build:dashboard

      - name: Verify dashboard dist exists
        run: ls dashboard/dist/index.html

  # ------------------------------------------------------------
  # 5. Full Verification
  # ------------------------------------------------------------
  verify:
    name: Full Verification (verify:all)
    runs-on: ubuntu-latest
    needs: build-verification
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: task
          POSTGRES_PASSWORD: task
          POSTGRES_DB: task_management_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U task -d task_management_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: ./dashboard

      - name: Run full verification
        run: npm run verify:all

      - name: Publish verification results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: verification-results
          path: |
            .playwright-mcp/*.png
            docs/dashboard.png
          retention-days: 30
