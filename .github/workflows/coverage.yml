name: Coverage

on:
  schedule:
    - cron: '0 2 * * 0'   # Weekly Sunday 02:00 UTC
  workflow_dispatch:

jobs:
  coverage:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run API coverage
        run: npm run test:coverage

      - name: Run dashboard coverage
        run: npm run test:dashboard:coverage

      - name: Comment on PR with coverage summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          comment_mode: update
          script: |
            # Coverage summary placeholder
            api_summary = 'API coverage: see artifact';
            dashboard_summary = 'Dashboard coverage: see artifact';
            // Comment on PR with both summaries